"没有科学发展就没有社会和谐，没有社会和谐也可以实现科学发展。() A对B错","options":[],"answer":"B"},{"id":"c9-q48","chapter":9,"chapterTitle":"第八章","number":48,"type":"truefalse","stem":"按照“一国两制”实现祖国和平统一，符合中华民族根本利益。() A对B错","options":[],"answer":"A"},{"id":"c9-q49","chapter":9,"chapterTitle":"第八章","number":49,"type":"truefalse","stem":"必须把提高领导水平和执政能力作为各级领导班子建设的核心内容抓紧抓好。() A对B错","options":[],"answer":"A"},{"id":"c9-q50","chapter":9,"chapterTitle":"第八章","number":50,"type":"truefalse","stem":"党管干部，必须坚持民主、公开、竞争、择优，形成干部选拔任用科学机制。() A对B错","options":[],"answer":"A"},{"id":"c9-q51","chapter":9,"chapterTitle":"第八章","number":51,"type":"truefalse","stem":"党的十七大报告提出，加快推进社会建设必须以改善民生为重点。() A对B错","options":[],"answer":"A"}]}]};
</script>
<script>
let bank, chapterIndex=0, exam=[], examAnswers={}, submitted=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={single:'单选题',multiple:'多选题',truefalse:'判断题',fill:'填空题'};
let saved={};try{saved=JSON.parse(localStorage.getItem('chapter-practice-v1')||'{}')}catch{}
function saveProgress(){try{localStorage.setItem('chapter-practice-v1',JSON.stringify(saved))}catch{}}
const norm=s=>String(s??'').trim().toLowerCase().replace(/[\s\u3000，,、。；;：:！!？?（）()“”"'‘’]/g,'');
function isRight(q,value){if(q.type==='fill')return (Array.isArray(q.answer)?q.answer:[q.answer]).some(a=>norm(a)===norm(value));if(q.type==='multiple')return [...value].sort().join('')===[...q.answer].sort().join('');return value===q.answer}
function setView(view){$('#practice-view').classList.toggle('hidden',view!=='practice');$('#exam-view').classList.toggle('hidden',view!=='exam');$('#tab-practice').classList.toggle('active',view==='practice');$('#tab-exam').classList.toggle('active',view==='exam')}
$('#tab-practice').onclick=()=>setView('practice');$('#tab-exam').onclick=()=>setView('exam');
function displayAnswer(q){if(q.type==='fill')return Array.isArray(q.answer)?q.answer.join('；'):q.answer;if(q.type==='truefalse')return q.answer==='A'?'对':'错';return q.answer}
function questionHTML(q,mode,position=0){const status=saved[q.id]||{};let solved=mode==='practice'&&status.solved;let heading=mode==='exam'?`第 ${position+1} 题`:`${q.chapterTitle} · ${q.number}`;let options=q.type==='fill'?'':`<div class="options">${(q.type==='truefalse'?['对','错']:q.options).map((o,i)=>`<button type="button" class="option" data-letter="${'ABCD'[i]}" aria-pressed="false"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;let blankCount=(q.stem.match(/_{4,}/g)||[]).length;return `<article class="question ${solved?'solved':''}" id="${mode}-${q.id}" data-id="${q.id}"><div class="q-head"><span class="q-num">${esc(heading)}</span><span class="q-type">${labels[q.type]}</span></div><p class="stem">${esc(q.stem)}</p>${options}${q.type==='fill'?`<div class="answer-row"><input class="fill-input" aria-label="填空答案" placeholder="${blankCount>1?'多个空按顺序用顿号隔开':'输入答案'}" autocomplete="off"><button class="primary check-fill">确认</button></div>`:''}${q.type==='multiple'&&mode==='practice'?'<div class="answer-row"><button class="primary check-multi">确认所选答案</button></div>':''}<div class="feedback ${solved?'good hidden':'hidden'}" role="status"></div></article>`}
function renderChapters(){let nav=$('#chapters');nav.innerHTML=bank.chapters.map((c,i)=>`<button class="chapter-btn ${i===chapterIndex?'active':''}" data-chapter="${i}">${esc(c.title)}</button>`).join('');nav.onclick=e=>{let b=e.target.closest('[data-chapter]');if(!b)return;chapterIndex=Number(b.dataset.chapter);renderChapters();renderPractice()}}
$('#reset-chapter').onclick=()=>{if(!bank)return;for(const q of bank.chapters[chapterIndex].questions)delete saved[q.id];saveProgress();renderPractice()};
function updatePracticeStats(){let c=bank.chapters[chapterIndex],done=c.questions.filter(q=>saved[q.id]?.solved).length;$('#practice-stats').innerHTML=`<span class="pill">${c.questions.length} 题</span><span class="pill">已完成 ${done} 题</span><span class="pill">完成率 ${Math.round(done/c.questions.length*100)||0}%</span>`}
function renderPractice(){let c=bank.chapters[chapterIndex];$('#practice-questions').innerHTML=c.questions.map(q=>questionHTML(q,'practice')).join('');updatePracticeStats();for(let q of c.questions){let card=document.getElementById('practice-'+q.id);if(saved[q.id]?.solved){let f=card.querySelector('.feedback');f.textContent=(saved[q.id].revealed?'已显示答案':'已答对')+' · 答案：'+displayAnswer(q);f.classList.remove('hidden');f.classList.toggle('bad',!!saved[q.id].revealed);f.classList.toggle('good',!saved[q.id].revealed);card.querySelectorAll('button,input').forEach(x=>x.disabled=true)}}}
function feedback(card,msg,kind){let f=card.querySelector('.feedback');f.textContent=msg;f.className='feedback '+kind}
function markPractice(q,card,value){if(isRight(q,value)){saved[q.id]={solved:true};saveProgress();card.classList.add('solved');feedback(card,'回答正确 ✓','good');card.querySelectorAll('button,input').forEach(x=>x.disabled=true);updatePracticeStats()}else if(q.type==='fill'){saved[q.id]={solved:true,revealed:true};saveProgress();feedback(card,'答案：'+displayAnswer(q),'bad');card.classList.add('solved');card.querySelectorAll('button,input').forEach(x=>x.disabled=true);updatePracticeStats()}else feedback(card,'回答错误，请继续尝试','bad')}
$('#practice-questions').addEventListener('click',e=>{let card=e.target.closest('.question');if(!card||saved[card.dataset.id]?.solved)return;let q=bank.lookup[card.dataset.id];if(e.target.closest('.option')){let b=e.target.closest('.option');if(q.type==='multiple'){b.classList.toggle('selected');b.setAttribute('aria-pressed',b.classList.contains('selected'));return}card.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');markPractice(q,card,b.dataset.letter)}else if(e.target.closest('.check-multi')){let value=[...card.querySelectorAll('.option.selected')].map(x=>x.dataset.letter);if(!value.length){feedback(card,'请先选择选项','info');return}markPractice(q,card,value)}else if(e.target.closest('.check-fill')){let value=card.querySelector('input').value;if(!value.trim()){feedback(card,'请填写答案','info');return}markPractice(q,card,value)}});
$('#practice-questions').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.fill-input'))e.target.nextElementSibling.click()});
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildExam(){const needs={single:50,multiple:20,truefalse:5,fill:5},counts=bank.chapters.map(()=>0),chosen=[];for(let [type,n] of Object.entries(needs)){for(let k=0;k<n;k++){let candidates=bank.chapters.map((c,i)=>({i,pool:c.questions.filter(q=>q.type===type&&!chosen.includes(q))})).filter(x=>x.pool.length&&counts[x.i]<9);if(!candidates.length)throw Error('题库中'+labels[type]+'数量不足，无法按指定比例组卷。');let min=Math.min(...candidates.map(x=>counts[x.i]));let pick=shuffle(candidates.filter(x=>counts[x.i]===min))[0];chosen.push(shuffle(pick.pool)[0]);counts[pick.i]++}}const order=['single','multiple','truefalse','fill'];return chosen.sort((a,b)=>order.indexOf(a.type)-order.indexOf(b.type)||a.chapter-b.chapter||a.number-b.number)}
function renderExam(){let notice=$('#exam-notice');notice.textContent='';try{exam=buildExam()}catch(e){notice.className='notice';notice.textContent=e.message;return}examAnswers={};submitted=false;$('#exam-summary').innerHTML=`<div class="panel"><strong>本卷 80 题</strong><div class="stats"><span class="pill">单选 50</span><span class="pill">多选 20</span><span class="pill">判断 5</span><span class="pill">填空 5</span></div></div>`;$('#exam-questions').innerHTML=exam.map((q,i)=>questionHTML(q,'exam',i)).join('');$('#submit-wrap').classList.remove('hidden');$('#exam-side').classList.remove('hidden');$('#redo-exam').classList.remove('hidden');renderExamNav()}
function renderExamNav(){if(!exam.length)return;let answered=exam.filter(q=>q.type==='fill'?String(examAnswers[q.id]||'').trim():Array.isArray(examAnswers[q.id])?examAnswers[q.id].length:!!examAnswers[q.id]).length;$('#exam-progress').textContent=submitted?`已批改 ${exam.length} 题`:`已答 ${answered} / ${exam.length} 题`;if(!submitted)$('#wrong-list').innerHTML='';}
$('#make-exam').onclick=renderExam;$('#redo-exam').onclick=renderExam;
$('#exam-questions').addEventListener('click',e=>{if(submitted)return;let card=e.target.closest('.question');if(!card)return;let q=bank.lookup[card.dataset.id],b=e.target.closest('.option');if(b){if(q.type==='multiple'){b.classList.toggle('selected');b.setAttribute('aria-pressed',b.classList.contains('selected'));examAnswers[q.id]=[...card.querySelectorAll('.option.selected')].map(x=>x.dataset.letter)}else{card.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');examAnswers[q.id]=b.dataset.letter}renderExamNav()}});
$('#exam-questions').addEventListener('input',e=>{if(e.target.matches('.fill-input')){examAnswers[e.target.closest('.question').dataset.id]=e.target.value;renderExamNav()}});
$('#submit-exam').onclick=()=>{let missing=exam.find(q=>q.type==='fill'?!(examAnswers[q.id]||'').trim():Array.isArray(examAnswers[q.id])?!examAnswers[q.id].length:!examAnswers[q.id]);if(missing){let card=document.getElementById('exam-'+missing.id);card.scrollIntoView({behavior:'smooth',block:'center'});feedback(card,'请先完成这道题，再提交整卷','info');return}submitted=true;let wrong=[];for(let [i,q] of exam.entries()){let card=document.getElementById('exam-'+q.id),right=isRight(q,examAnswers[q.id]);feedback(card,`${right?'回答正确':'回答错误'} · 正确答案：${displayAnswer(q)}`,right?'good':'bad');if(!right){wrong.push({i,q});card.classList.add('exam-wrong')}card.querySelectorAll('button,input').forEach(x=>x.disabled=true)}$('#submit-wrap').classList.add('hidden');$('#exam-summary').innerHTML=`<div class="panel"><h2>批改完成：${exam.length-wrong.length} / ${exam.length}</h2><div class="muted">点击右侧错题可直接定位。答案已在每道题下方显示。</div></div>`;$('#exam-progress').textContent=`错题 ${wrong.length} 道`;$('#wrong-list').innerHTML=wrong.length?wrong.map(({i,q})=>`<button data-jump="exam-${q.id}">第 ${i+1} 题 · ${labels[q.type]}</button>`).join(''):'全部答对，做得很好！';$('#wrong-list').onclick=e=>{let b=e.target.closest('[data-jump]');if(b)document.getElementById(b.dataset.jump).scrollIntoView({behavior:'smooth',block:'center'})};window.scrollTo({top:0,behavior:'smooth'})};
Promise.resolve(window.QUESTION_BANK).then(data=>{if(!data)throw Error('题库加载失败');bank=data;bank.lookup=Object.fromEntries(data.chapters.flatMap(c=>c.questions.map(q=>[q.id,q])));$('#total-count').textContent=data.chapters.reduce((n,c)=>n+c.questions.length,0)+' 道题 · 9 章';renderChapters();renderPractice()}).catch(e=>{$('#practice-questions').innerHTML='<div class="notice">'+esc(e.message)+'</div>';$('#total-count').textContent='题库加载失败'});

</script>
</body></html>
